{% extends "admin/base_site.html" %}

{% block content %}
<div style="padding: 20px; font-family: 'Roboto', sans-serif;">
    <h1 style="color: #417690; margin-bottom: 25px;">{{ title }}</h1>

    <div style="display: flex; gap: 20px; margin-bottom: 30px;">
        <div style="flex: 1; background: #28a745; color: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <p style="margin: 0; font-size: 14px; opacity: 0.8;">Tổng Doanh Thu Hệ Thống</p>
            <h2 style="margin: 10px 0 0;">{{ total_revenue|floatformat:0 }} VNĐ</h2>
        </div>
        <div style="flex: 1; background: #17a2b8; color: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <p style="margin: 0; font-size: 14px; opacity: 0.8;">Tổng Số Sinh Viên</p>
            <h2 style="margin: 10px 0 0;">{{ total_students }} Học viên</h2>
        </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">

        <div style="background: white; padding: 20px; border-radius: 10px; border: 1px solid #ddd;">
            <h3 style="text-align: center; color: #666;">Top 5 Doanh Thu Theo Khóa Học</h3>
            <canvas id="revenueChart"></canvas>
        </div>

        <div style="background: white; padding: 20px; border-radius: 10px; border: 1px solid #ddd;">
            <h3 style="text-align: center; color: #666;">Tần Suất Đăng Ký Theo Tháng</h3>
            <canvas id="enrollmentChart"></canvas>
        </div>

        <div style="background: white; padding: 20px; border-radius: 10px; border: 1px solid #ddd;">
            <h3 style="text-align: center; color: #666;">Phân Bổ Khóa Học Theo Danh Mục</h3>
            <div style="max-width: 350px; margin: auto;">
                <canvas id="categoryChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {

        // 1. DỮ LIỆU DOANH THU (BAR CHART)
        const revenueLabels = [{% for r in revenue_stats %}"{{ r.subject|escapejs }}",{% endfor %}];
        const revenueData = [{% for r in revenue_stats %}{{ r.total_rev|default:0 }},{% endfor %}];

        new Chart(document.getElementById('revenueChart'), {
            type: 'bar',
            data: {
                labels: revenueLabels,
                datasets: [{ label: 'Doanh thu (VNĐ)', data: revenueData, backgroundColor: '#28a745' }]
            }
        });

        // 2. DỮ LIỆU TẦN SUẤT ĐĂNG KÝ (LINE CHART)
        const trendLabels = [{% for e in enrollment_trend %}"{{ e.month|date:'m/Y' }}",{% endfor %}];
        const trendData = [{% for e in enrollment_trend %}{{ e.count }},{% endfor %}];

        new Chart(document.getElementById('enrollmentChart'), {
            type: 'line',
            data: {
                labels: trendLabels,
                datasets: [{
                    label: 'Lượt đăng ký',
                    data: trendData,
                    borderColor: '#17a2b8',
                    tension: 0.3,
                    fill: true,
                    backgroundColor: 'rgba(23, 162, 184, 0.1)'
                }]
            }
        });

        // 3. DỮ LIỆU DANH MỤC (PIE CHART)
        const catLabels = [{% for s in stats %}"{{ s.name|escapejs }}",{% endfor %}];
        const catData = [{% for s in stats %}{{ s.c }},{% endfor %}];

        new Chart(document.getElementById('categoryChart'), {
            type: 'pie',
            data: {
                labels: catLabels,
                datasets: [{
                    data: catData,
                    backgroundColor: ['#ff6384', '#36a2eb', '#ffce56', '#4bc0c0', '#9966ff']
                }]
            }
        });
    });
</script>
{% endblock %}
